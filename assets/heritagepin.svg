<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="300"
     viewBox="0 0 1000 300"
     role="img"
     aria-labelledby="title description">

  <title id="title">HeritagePin — People Places Stories</title>

  <desc id="description">
    HeritagePin is a digital heritage platform connecting heritage sites,
    digital archives, communities and visitors through an interactive
    heritage mapping system.
  </desc>

  <defs>

    <!-- ============================================ -->
    <!-- BACKGROUND GRID -->
    <!-- ============================================ -->

    <pattern id="grid"
             width="22"
             height="22"
             patternUnits="userSpaceOnUse">

      <path d="M22 0H0V22"
            fill="none"
            stroke="#172126"
            stroke-opacity=".075"/>

    </pattern>


    <!-- ============================================ -->
    <!-- RADIAL GLOW -->
    <!-- ============================================ -->

    <radialGradient id="pinGlow">

      <stop offset="0%"
            stop-color="#f4c95d"
            stop-opacity=".45"/>

      <stop offset="55%"
            stop-color="#f4c95d"
            stop-opacity=".12"/>

      <stop offset="100%"
            stop-color="#f4c95d"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ============================================ -->
    <!-- STYLES -->
    <!-- ============================================ -->

    <style>

      text {
        font-family:
          Arial,
          Helvetica,
          sans-serif;
      }

      .mono {
        font-family:
          Consolas,
          'Liberation Mono',
          monospace;
      }


      /* -------------------------------------------- */
      /* Data paths */
      /* -------------------------------------------- */

      .data-flow {
        stroke-dasharray: 4 10;
        animation:
          dataFlow 3s linear infinite;
      }

      @keyframes dataFlow {

        to {
          stroke-dashoffset: -56;
        }

      }


      /* -------------------------------------------- */
      /* Expanding heritage scan */
      /* -------------------------------------------- */

      .scan-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: scan 3.5s ease-out infinite;
      }

      .scan-ring:nth-child(2) {
        animation-delay: 1.15s;
      }

      .scan-ring:nth-child(3) {
        animation-delay: 2.3s;
      }

      @keyframes scan {

        0% {
          transform: scale(.35);
          opacity: .75;
        }

        70% {
          opacity: .18;
        }

        100% {
          transform: scale(1.35);
          opacity: 0;
        }

      }


      /* -------------------------------------------- */
      /* Central pin */
      /* -------------------------------------------- */

      .pin {
        transform-box: fill-box;
        transform-origin: center;
        animation: pinPulse 2.5s ease-in-out infinite;
      }

      @keyframes pinPulse {

        0%, 100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }

      }


      /* -------------------------------------------- */
      /* Moving map markers */
      /* -------------------------------------------- */

      .orbit-marker-1 {
        animation:
          orbitOne 6s linear infinite;
        transform-origin: 790px 151px;
      }

      .orbit-marker-2 {
        animation:
          orbitTwo 7s linear infinite;
        transform-origin: 790px 151px;
      }

      .orbit-marker-3 {
        animation:
          orbitThree 8s linear infinite;
        transform-origin: 790px 151px;
      }


      @keyframes orbitOne {

        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }

      }


      @keyframes orbitTwo {

        from {
          transform: rotate(120deg);
        }

        to {
          transform: rotate(480deg);
        }

      }


      @keyframes orbitThree {

        from {
          transform: rotate(240deg);
        }

        to {
          transform: rotate(600deg);
        }

      }


      /* -------------------------------------------- */
      /* Phone screen blink */
      /* -------------------------------------------- */

      .phone-pin {
        animation:
          phoneBlink 2s ease-in-out infinite;
      }

      @keyframes phoneBlink {

        0%, 100% {
          opacity: 1;
        }

        50% {
          opacity: .35;
        }

      }


      /* -------------------------------------------- */
      /* Reduced motion */
      /* -------------------------------------------- */

      @media (prefers-reduced-motion: reduce) {

        .data-flow,
        .scan-ring,
        .pin,
        .orbit-marker-1,
        .orbit-marker-2,
        .orbit-marker-3,
        .phone-pin {
          animation: none;
        }

      }

    </style>

