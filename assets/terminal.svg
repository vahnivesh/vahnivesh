<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="540" viewBox="0 0 1000 540"
     role="img" aria-labelledby="title description">

  <title id="title">Vahnivesh — Neo-Brutalist portfolio</title>
  <desc id="description">
    A bold developer banner for Vahnivesh S Shine with black outlines,
    hard shadows, yellow and lilac panels, and animated code graphics.
    Member of Team BareMetal. Featuring Trinetra and 6sense.
  </desc>

  <defs>
    <pattern id="grid" width="28" height="28"
             patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none" stroke="#191919" stroke-opacity=".07"/>
    </pattern>

    <clipPath id="canvas">
      <rect width="1000" height="540" rx="8"/>
    </clipPath>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
      }

      .mono {
        font-family: Consolas, 'Liberation Mono', monospace;
      }

      .press {
        animation: press 6s ease-in-out infinite;
      }

      .bracket-left {
        animation: left 5s ease-in-out infinite;
      }

      .bracket-right {
        animation: right 5s ease-in-out infinite;
      }

      .orbit {
        animation: orbit 30s linear infinite;
      }

      .signal {
        stroke-dasharray: 5 9;
        animation: signal 4s linear infinite;
      }

      @keyframes press {
        0%, 25%, 100% { transform: translate(0, 0); }
        45%, 60% { transform: translate(4px, 4px); }
      }

      @keyframes left {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-5px); }
      }

      @keyframes right {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(5px); }
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes signal {
        to { stroke-dashoffset: -56; }
      }

      @media (prefers-reduced-motion: reduce) {
        .press,
        .bracket-left,
        .bracket-right,
        .orbit,
        .signal {
          animation: none;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#canvas)">

    <!-- Paper canvas -->
    <rect width="1000" height="540" fill="#f6f2e9"/>
    <rect width="1000" height="540" fill="url(#grid)"/>

    <!-- Masthead -->
    <rect x="29" y="29" width="942" height="42" fill="#191919"/>
    <rect x="24" y="24" width="942" height="42"
          fill="#ffffff" stroke="#191919" stroke-width="3"/>

    <rect x="24" y="24" width="49" height="42" fill="#191919"/>

    <text x="48" y="52" text-anchor="middle"
          class="mono" font-size="22" font-weight="700"
          fill="#ffe45b">v.</text>

    <text x="89" y="51"
          class="mono" font-size="12" font-weight="700"
          letter-spacing="1" fill="#191919">
      VAHNIVESH / DEVELOPER
    </text>

    <text x="947" y="51" text-anchor="end"
          class="mono" font-size="11" font-weight="700"
          fill="#191919">
      TEAM BAREMETAL
    </text>

    <!-- Introduction panel -->
    <rect x="32" y="100" width="612" height="226"
          fill="#191919"/>

    <rect x="24" y="92" width="612" height="226"
          fill="#ffe45b" stroke="#191919" stroke-width="3.5"/>

    <text x="45" y="127"
          class="mono" font-size="11" font-weight="700"
          letter-spacing="1.7" fill="#191919">
      HELLO, WORLD.
    </text>

    <text x="41" y="192"
          font-size="69" font-weight="900"
          letter-spacing="-3.5" fill="#191919">
      VAHNIVESH
    </text>

    <text x="45" y="233"
          font-size="31" font-weight="800"
          letter-spacing="-1" fill="#191919">
      S SHINE.
    </text>

    <path d="M46 250H589" stroke="#191919" stroke-width="3"/>

    <text x="46" y="282" font-size="16" fill="#191919">
      Software. Hardware. Ideas made tangible.
    </text>

    <!-- Graphic panel -->
    <rect x="668" y="100" width="306" height="226"
          fill="#191919"/>

    <rect x="660" y="92" width="306" height="226"
          fill="#cbb8ff" stroke="#191919" stroke-width="3.5"/>

    <text x="680" y="123"
          class="mono" font-size="10" font-weight="700"
          letter-spacing="1.4" fill="#191919">
      BUILD / LEARN / ITERATE
    </text>

    <!-- Pressing code tile with a fixed shadow -->
    <g transform="translate(813 218)">
      <rect x="-64" y="-53" width="144" height="118"
            fill="#191919"/>

      <g class="press">
        <rect x="-72" y="-61" width="144" height="118"
              fill="#ffffff" stroke="#191919" stroke-width="3"/>

        <path d="M-72-36H72" stroke="#191919" stroke-width="3"/>

        <g fill="#191919">
          <rect x="-60" y="-52" width="6" height="6"/>
          <rect x="-48" y="-52" width="6" height="6"/>
          <rect x="-36" y="-52" width="6" height="6"/>
        </g>

        <g transform="translate(0 9)"
           fill="none" stroke="#191919" stroke-width="5"
           stroke-linecap="square" stroke-linejoin="miter">
          <path class="bracket-left" d="M-22-15L-38 0L-22 15"/>
          <path class="bracket-right" d="M22-15L38 0L22 15"/>
          <path d="M8-22L-8 22"/>
        </g>
      </g>
    </g>

    <!-- Trinetra project -->
    <rect x="32" y="352" width="448" height="130"
          fill="#191919"/>

    <rect x="24" y="344" width="448" height="130"
          fill="#d9f0e4" stroke="#191919" stroke-width="3.5"/>

    <rect x="24" y="344" width="48" height="29" fill="#191919"/>

    <text x="48" y="364" text-anchor="middle"
          class="mono" font-size="12" font-weight="700"
          fill="#ffffff">01</text>

    <text x="84" y="364"
          class="mono" font-size="10" font-weight="700"
          letter-spacing="1" fill="#191919">
      SELECTED PROJECT
    </text>

    <text x="44" y="415"
          font-size="36" font-weight="900"
          letter-spacing="-1.4" fill="#191919">
      TRINETRA
    </text>

    <text x="45" y="446" font-size="13" fill="#263c31">
      One core. Three form factors.
    </text>

    <!-- Sensor-core motif -->
    <g transform="translate(404 412)">
      <path d="M0-17V-36M15 9L31 19M-15 9L-31 19"
            fill="none" stroke="#191919" stroke-width="2.5"/>

      <circle class="signal" r="37"
              fill="none" stroke="#4b7b65" stroke-width="2"/>

      <g fill="#191919">
        <rect x="-4" y="-42" width="8" height="8"/>
        <rect x="29" y="17" width="8" height="8"/>
        <rect x="-37" y="17" width="8" height="8"/>
      </g>

      <rect x="-16" y="-16" width="32" height="32"
            fill="#ffffff" stroke="#191919" stroke-width="3"/>

      <rect x="-6" y="-6" width="12" height="12" fill="#191919"/>
    </g>

    <!-- 6sense project -->
    <rect x="504" y="352" width="470" height="130"
          fill="#191919"/>

    <rect x="496" y="344" width="470" height="130"
          fill="#ffb89f" stroke="#191919" stroke-width="3.5"/>

    <rect x="496" y="344" width="48" height="29" fill="#191919"/>

    <text x="520" y="364" text-anchor="middle"
          class="mono" font-size="12" font-weight="700"
          fill="#ffffff">02</text>

    <text x="556" y="364"
          class="mono" font-size="10" font-weight="700"
          letter-spacing="1" fill="#191919">
      SELECTED PROJECT
    </text>

    <text x="516" y="416"
          font-size="39" font-weight="900"
          letter-spacing="-1.5" fill="#191919">
      6sense
    </text>

    <text x="517" y="446" font-size="13" fill="#54392e">
      Explore the project.
    </text>

    <!-- Six-point project identity -->
    <g transform="translate(896 412)">
      <g class="orbit">
        <path d="M0-35L30.3-17.5L30.3 17.5L0 35L-30.3 17.5L-30.3-17.5Z"
              fill="none" stroke="#191919" stroke-width="2"/>

        <g fill="#191919">
          <circle cy="-35" r="4"/>
          <circle cx="30.3" cy="-17.5" r="4"/>
          <circle cx="30.3" cy="17.5" r="4"/>
          <circle cy="35" r="4"/>
          <circle cx="-30.3" cy="17.5" r="4"/>
          <circle cx="-30.3" cy="-17.5" r="4"/>
        </g>
      </g>

      <rect x="-17" y="-20" width="34" height="40"
            fill="#fffaf0" stroke="#191919" stroke-width="2.5"/>

      <text y="10" text-anchor="middle"
            font-size="29" font-weight="900" fill="#191919">6</text>
    </g>

    <!-- Footer -->
    <text x="25" y="516"
          class="mono" font-size="11" font-weight="700"
          fill="#191919">
      CODE WITH INTENT. KEEP BUILDING.
    </text>

    <text x="968" y="516" text-anchor="end"
          class="mono" font-size="11" fill="#191919">
      github.com/vahnivesh
    </text>

  </g>
</svg>
