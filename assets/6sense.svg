<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-labelledby="title description">

  <title id="title">6sense — selected project</title>
  <desc id="description">
    A Neo-Brutalist banner for 6sense, featuring oversized typography,
    coral and lilac panels, hard black shadows, and a rotating
    six-point geometric emblem.
  </desc>

  <defs>
    <pattern id="dots" width="16" height="16"
             patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1"
              fill="#191919" opacity=".12"/>
    </pattern>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
      }

      .mono {
        font-family: Consolas, 'Liberation Mono', monospace;
      }

      .orbit {
        animation: orbit 30s linear infinite;
      }

      .press {
        animation: press 6s ease-in-out infinite;
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes press {
        0%, 25%, 100% { transform: translate(0, 0); }
        45%, 60% { transform: translate(4px, 4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit, .press { animation: none; }
      }
    </style>
  </defs>

  <!-- Paper and hard shadow -->
  <rect width="1000" height="300" fill="#f6f2e9"/>

  <rect x="26" y="26" width="956" height="256"
        fill="#191919"/>

  <rect x="18" y="18" width="956" height="256"
        fill="#ffb89f" stroke="#191919" stroke-width="3.5"/>

  <!-- Header strip -->
  <rect x="18" y="18" width="956" height="35"
        fill="#191919"/>

  <text x="37" y="41"
        class="mono" font-size="11" font-weight="700"
        letter-spacing="1.1" fill="#ffffff">
    6sense / VAHNIVESH
  </text>

  <text x="954" y="41" text-anchor="end"
        class="mono" font-size="10" font-weight="700"
        fill="#ffb89f">
    PROJECT 02
  </text>

  <!-- Large project name -->
  <text x="36" y="160"
        font-size="105" font-weight="900"
        letter-spacing="-6" fill="#191919">
    6sense
  </text>

  <text x="43" y="198"
        class="mono" font-size="16" font-weight="700"
        fill="#191919">
    SELECTED WORK.
  </text>

  <!-- Repository label -->
  <rect x="47" y="228" width="267" height="29"
        fill="#191919"/>

  <rect x="43" y="224" width="267" height="29"
        fill="#fffaf0" stroke="#191919" stroke-width="2"/>

  <text x="57" y="244"
        class="mono" font-size="12" fill="#191919">
    ~/vahnivesh/projects/6sense
  </text>

  <!-- Offset geometric panel -->
  <rect x="652" y="77" width="290" height="181"
        fill="#191919"/>

  <rect x="646" y="71" width="290" height="181"
        fill="#cbb8ff" stroke="#191919" stroke-width="3"/>

  <rect x="648" y="73" width="286" height="177"
        fill="url(#dots)"/>

  <!-- Corner framing marks -->
  <g fill="none" stroke="#191919" stroke-width="2.5">
    <path d="M661 96V86H671"/>
    <path d="M911 86H921V96"/>
    <path d="M661 227V237H671"/>
    <path d="M911 237H921V227"/>
  </g>

  <!-- Animated six-point emblem -->
  <g transform="translate(791 161)">

    <g class="orbit">
      <path d="M0-67L58-33.5L58 33.5L0 67L-58 33.5L-58-33.5Z"
            fill="none" stroke="#191919" stroke-width="2.5"/>

      <g fill="#fffaf0" stroke="#191919" stroke-width="2.5">
        <rect x="-5" y="-72" width="10" height="10"/>
        <rect x="53" y="-38.5" width="10" height="10"/>
        <rect x="53" y="28.5" width="10" height="10"/>
        <rect x="-5" y="62" width="10" height="10"/>
        <rect x="-63" y="28.5" width="10" height="10"/>
        <rect x="-63" y="-38.5" width="10" height="10"/>
      </g>
    </g>

    <!-- Fixed shadow, moving foreground -->
    <rect x="-27" y="-33" width="66" height="78"
          fill="#191919"/>

    <g class="press">
      <rect x="-34" y="-40" width="66" height="78"
            fill="#ffe45b" stroke="#191919" stroke-width="3"/>

      <text x="-1" y="21" text-anchor="middle"
            font-size="62" font-weight="900"
            letter-spacing="-3" fill="#191919">
        6
      </text>
    </g>
  </g>
</svg>
